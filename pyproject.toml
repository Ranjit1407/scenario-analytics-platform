[project]
name = "scenario-analytics"
version = "1.0.0"
description = "Scenario processing engine, PostgreSQL reporting and REST API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
