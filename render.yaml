# Render Blueprint: creates the PostgreSQL instance and the API service.
# Render dashboard -> New -> Blueprint -> select this repository.
databases:
  - name: scenario-analytics-db
    databaseName: scenario_analytics
    user: scenario_app
    plan: free

services:
  - type: web
    name: scenario-analytics-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scenario-analytics-db
          property: connectionString
      - key: IMPORT_API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
